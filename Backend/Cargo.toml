[package]
name = "fazm-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authentication
jsonwebtoken = "9"

# RSA key handling
rsa = { version = "0.9", features = ["pem"] }

# Utilities
dotenvy = "0.15"
chrono = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.21"
hex = "0.4"
hmac = "0.12"
url = "2"

# HTTP client (for IAM signBlob API). `stream` enables Response::bytes_stream()
# for the /v1/tts audio passthrough (true streaming, no full-buffer).
reqwest = { version = "0.12", features = ["json", "stream"] }

# Lightweight regex (no_std compatible, for appcast parsing)
regex-lite = "0.1"

# URL encoding (for Firestore document paths)
urlencoding = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
